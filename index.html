<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vườn Sao & Tiểu Tinh Linh ✨</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-color: #070811;
      --card-bg: rgba(18, 20, 38, 0.75);
      --card-border: rgba(255, 224, 130, 0.25);
      --star-yellow: #ffe082;
      --star-pink: #ff80ab;
      --star-cyan: #80d8ff;
      --star-green: #a7ffeb;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --font-cute: 'Gaegu', cursive, sans-serif;
      --font-body: 'Nunito', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: var(--font-body);
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
      padding-bottom: 90px;
    }

    #starCanvas {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      z-index: 0; pointer-events: none;
    }

    .container {
      max-width: 1000px; margin: 0 auto; padding: 0 20px;
      position: relative; z-index: 2;
    }

    /* Thanh điều khiển trên cùng */
    .top-bar {
      display: flex; justify-content: flex-end; padding-top: 15px;
    }

    .admin-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px dashed var(--star-yellow);
      color: var(--star-yellow);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.9rem;
      cursor: pointer;
      font-family: var(--font-cute);
      font-size: 1.15rem;
    }

    header { text-align: center; padding: 20px 0 25px; }

    h1 {
      font-family: var(--font-cute);
      font-size: 3.2rem;
      color: var(--star-yellow);
      text-shadow: 0 0 15px rgba(255, 224, 130, 0.5);
      line-height: 1.1; margin-bottom: 8px;
    }

    p.subtitle { color: var(--text-muted); font-size: 1.05rem; }

    /* Bộ lọc & Nút Đăng bài */
    .actions-bar {
      display: flex; justify-content: center; align-items: center;
      gap: 10px; margin: 20px 0 30px; flex-wrap: wrap;
    }

    .filter-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px dashed var(--card-border);
      color: var(--text-muted);
      padding: 7px 16px; border-radius: 20px;
      cursor: pointer; font-family: var(--font-cute);
      font-size: 1.25rem; transition: all 0.25s ease;
    }

    .filter-btn:hover, .filter-btn.active {
      background: rgba(255, 224, 130, 0.18);
      color: var(--star-yellow);
      border-color: var(--star-yellow);
    }

    .btn-create-post {
      background: linear-gradient(135deg, #ff80ab, #f06292);
      color: #fff; border: none; padding: 7px 18px;
      border-radius: 20px; font-family: var(--font-cute);
      font-size: 1.3rem; font-weight: 700; cursor: pointer;
      display: none; /* Chỉ hiện khi bật quyền quản trị */
      box-shadow: 0 0 15px rgba(255, 128, 171, 0.4);
    }

    /* Grid cards */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 22px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 18px; padding: 22px;
      backdrop-filter: blur(12px);
      display: flex; flex-direction: column; justify-content: space-between;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      position: relative;
    }

    .card-top {
      display: flex; justify-content: space-between; align-items: flex-start;
    }

    .card-tag {
      font-family: var(--font-cute); font-size: 1.15rem;
      padding: 3px 12px; border-radius: 10px;
      display: inline-block; margin-bottom: 12px;
    }

    .tag-story {
      background: rgba(255, 128, 171, 0.15);
      color: var(--star-pink); border: 1px solid rgba(255, 128, 171, 0.3);
    }

    .tag-bot {
      background: rgba(128, 216, 255, 0.15);
      color: var(--star-cyan); border: 1px solid rgba(128, 216, 255, 0.3);
    }

    .btn-delete {
      background: none; border: none; color: #ff5252;
      font-size: 1.2rem; cursor: pointer; display: none;
    }

    .card-title { font-size: 1.25rem; font-weight: 700; color: #fff; margin-bottom: 8px; }
    .card-desc { color: var(--text-muted); font-size: 0.95rem; line-height: 1.5; margin-bottom: 20px; }

    .card-actions { display: flex; gap: 10px; align-items: center; }

    .btn-link {
      flex: 1; text-align: center;
      background: linear-gradient(135deg, #ffe082, #ffca28);
      color: #161824; font-weight: 800; padding: 9px 12px;
      border-radius: 10px; text-decoration: none; font-size: 0.95rem;
    }

    .btn-comment {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: var(--text-main); padding: 9px 14px;
      border-radius: 10px; cursor: pointer;
    }

    /* Đàn bụi than */
    .sprite {
      position: fixed; z-index: 10; cursor: pointer; user-select: none;
      filter: drop-shadow(0 0 6px rgba(0,0,0,0.8));
    }
    .sprite:active { transform: scale(1.5) rotate(15deg) !important; }

    .sprite-1 {
      bottom: 12px; left: -60px; width: 48px; height: 48px;
      animation: runAcross 18s linear infinite, wobble 0.35s ease-in-out infinite alternate;
    }
    .sprite-2 {
      bottom: 25px; right: 20px; width: 44px; height: 44px;
      animation: hopAround 4s ease-in-out infinite alternate;
    }

    @keyframes runAcross {
      0% { left: -60px; transform: scaleX(1); }
      48% { transform: scaleX(1); }
      50% { left: calc(100vw + 10px); transform: scaleX(-1); }
      98% { transform: scaleX(-1); }
      100% { left: -60px; transform: scaleX(1); }
    }
    @keyframes wobble {
      0% { transform: translateY(0px) rotate(-6deg); }
      100% { transform: translateY(-7px) rotate(6deg); }
    }
    @keyframes hopAround {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(-30px, -20px) rotate(-10deg); }
    }

    /* Modals */
    .modal {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0, 0, 0, 0.8); backdrop-filter: blur(8px);
      display: none; justify-content: center; align-items: center;
      z-index: 999; padding: 16px;
    }
    .modal.active { display: flex; }

    .modal-content {
      background: #121422; border: 1px solid var(--star-yellow);
      border-radius: 20px; width: 100%; max-width: 480px;
      padding: 24px; box-shadow: 0 0 35px rgba(255, 224, 130, 0.25);
      max-height: 90vh; overflow-y: auto;
    }

    .modal-header {
      display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;
    }

    .modal-title { font-family: var(--font-cute); font-size: 1.8rem; color: var(--star-yellow); }
    .close-btn { background: none; border: none; color: var(--text-muted); font-size: 1.8rem; cursor: pointer; }

    .form-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
    .form-group label { font-size: 0.9rem; color: var(--star-cyan); }
    .form-group input, .form-group textarea, .form-group select {
      background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 10px; padding: 11px; color: #fff; font-family: inherit; outline: none;
    }
    .form-group select option { background: #121422; color: #fff; }

    .btn-submit {
      width: 100%; background: var(--star-yellow); color: #12131c;
      font-weight: 800; padding: 12px; border: none; border-radius: 10px;
      cursor: pointer; font-family: var(--font-cute); font-size: 1.35rem; margin-top: 10px;
    }

    .comments-list {
      max-height: 220px; overflow-y: auto; margin-bottom: 15px;
      display: flex; flex-direction: column; gap: 10px;
    }
    .comment-item {
      background: rgba(255, 255, 255, 0.05); padding: 10px 14px;
      border-radius: 12px; border-left: 3px solid var(--star-pink);
    }
    .comment-author { font-weight: 700; font-size: 0.9rem; color: var(--star-green); margin-bottom: 2px; }
  </style>
</head>
<body>

  <canvas id="starCanvas"></canvas>

  <!-- Đàn bụi than lon ton -->
  <div class="sprite sprite-1" title="Chạm vào tớ đi!">
    <svg viewBox="0 0 100 100" fill="none">
      <path d="M50 5 L55 18 L68 10 L68 24 L82 22 L77 35 L90 40 L80 50 L92 60 L78 65 L84 78 L70 78 L68 92 L55 83 L50 95 L45 83 L32 92 L30 78 L16 78 L22 65 L8 60 L20 50 L10 40 L23 35 L18 22 L32 24 L32 10 L45 18 Z" fill="#11121a"/>
      <ellipse cx="37" cy="42" rx="10" ry="12" fill="white"/>
      <circle cx="40" cy="42" r="4.5" fill="#111"/>
      <ellipse cx="63" cy="42" rx="10" ry="12" fill="white"/>
      <circle cx="60" cy="42" r="4.5" fill="#111"/>
      <polygon points="50,60 54,69 64,69 56,75 59,85 50,79 41,85 44,75 36,69 46,69" fill="#ff80ab"/>
    </svg>
  </div>

  <div class="sprite sprite-2" title="Chạm vào tớ đi!">
    <svg viewBox="0 0 100 100" fill="none">
      <path d="M50 5 L55 18 L68 10 L68 24 L82 22 L77 35 L90 40 L80 50 L92 60 L78 65 L84 78 L70 78 L68 92 L55 83 L50 95 L45 83 L32 92 L30 78 L16 78 L22 65 L8 60 L20 50 L10 40 L23 35 L18 22 L32 24 L32 10 L45 18 Z" fill="#141520"/>
      <ellipse cx="36" cy="40" rx="9" ry="11" fill="white"/>
      <circle cx="39" cy="39" r="4" fill="#111"/>
      <ellipse cx="64" cy="40" rx="9" ry="11" fill="white"/>
      <circle cx="67" cy="39" r="4" fill="#111"/>
      <polygon points="50,62 54,71 64,71 56,77 59,87 50,81 41,87 44,77 36,71 46,71" fill="#ffe082"/>
    </svg>
  </div>

  <div class="container">
    <!-- Nút quản trị ở góc phải -->
    <div class="top-bar">
      <button class="admin-btn" id="adminToggleBtn" onclick="toggleAdminPrompt()">🔑 Quản trị</button>
    </div>

    <header>
      <h1>Vườn Sao & Tiểu Tinh Linh</h1>
      <p class="subtitle">Nơi lưu giữ các truyện tớ viết & các em Bot AI tớ tạo ra ✨</p>
    </header>

    <div class="actions-bar">
      <button class="filter-btn active" onclick="filterItems('all')">⭐ Tất cả</button>
      <button class="filter-btn" onclick="filterItems('story')">📖 Truyện</button>
      <button class="filter-btn" onclick="filterItems('bot')">🤖 Bot AI</button>
      <!-- Nút đăng bài (chỉ mở khi đăng nhập quản trị) -->
      <button class="btn-create-post" id="btnCreatePost" onclick="openCreateModal()">➕ Đăng bài mới</button>
    </div>

    <div class="grid" id="cardGrid"></div>
  </div>

  <!-- MODAL ĐĂNG BÀI MỚI -->
  <div class="modal" id="createPostModal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 class="modal-title">✨ Thêm Link Mới</h3>
        <button class="close-btn" onclick="closeCreateModal()">&times;</button>
      </div>

      <form onsubmit="handleCreatePost(event)">
        <div class="form-group">
          <label>Thể loại</label>
          <select id="postType">
            <option value="story">📖 Truyện</option>
            <option value="bot">🤖 Bot AI</option>
          </select>
        </div>

        <div class="form-group">
          <label>Tiêu đề</label>
          <input type="text" id="postTitle" placeholder="Ví dụ: Chuyến tàu đêm đầy sao..." required>
        </div>

        <div class="form-group">
          <label>Đường link (URL)</label>
          <input type="url" id="postLink" placeholder="https://wattpad.com/... hoặc link Bot" required>
        </div>

        <div class="form-group">
          <label>Mô tả ngắn</label>
          <textarea id="postDesc" rows="3" placeholder="Viết đôi dòng giới thiệu nội dung truyện hoặc bot..." required></textarea>
        </div>

        <button type="submit" class="btn-submit">Đăng lên Vườn Sao 🚀</button>
      </form>
    </div>
  </div>

  <!-- MODAL BÌNH LUẬN -->
  <div class="modal" id="commentModal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 class="modal-title" id="modalPostTitle">Bình luận</h3>
        <button class="close-btn" onclick="closeComments()">&times;</button>
      </div>

      <div class="comments-list" id="modalCommentsList"></div>

      <form onsubmit="handleSendComment(event)">
        <div class="form-group">
          <input type="text" id="commentAuthor" placeholder="Tên hoặc biệt danh của cậu..." required>
        </div>
        <div class="form-group">
          <textarea id="commentBody" rows="3" placeholder="Gửi một ngôi sao hoặc lời nhắn..." required></textarea>
        </div>
        <button type="submit" class="btn-submit">Thả sao & Gửi ✨</button>
      </form>
    </div>
  </div>

  <script>
    /* =========================================================
       1. MẬT KHẨU QUẢN TRỊ (Cậu có thể đổi pass tại đây)
       ========================================================= */
    const ADMIN_PASSWORD = "1234"; 
    let isAdmin = false;

    // Dữ liệu mặc định
    const defaultData = [
      {
        id: 1,
        type: 'story',
        title: 'Chuyến Tàu Đêm Đầy Sao',
        desc: 'Một câu chuyện nhẹ nhàng kể về những linh hồn đi lạc trên chuyến tàu băng qua dải ngân hà...',
        link: 'https://wattpad.com'
      },
      {
        id: 2,
        type: 'bot',
        title: 'Em Bot Tâm Sự Đêm Khuya',
        desc: 'Bot AI được lập trình bằng Google AI Studio, chuyên lắng nghe tâm sự và phát kẹo sao an ủi.',
        link: 'https://gemini.google.com'
      }
    ];

    function getStoredPosts() {
      const saved = localStorage.getItem('starry_hub_posts');
      return saved ? JSON.parse(saved) : defaultData;
    }

    function savePosts(posts) {
      localStorage.setItem('starry_hub_posts', JSON.stringify(posts));
    }

    let myData = getStoredPosts();
    let currentFilter = 'all';
    let currentPostId = null;

    // Quản trị viên
    function toggleAdminPrompt() {
      if (!isAdmin) {
        const pass = prompt("Nhập mật khẩu quản trị của cậu nha (Mặc định: 1234):");
        if (pass === ADMIN_PASSWORD) {
          isAdmin = true;
          document.getElementById('adminToggleBtn').innerText = "🔓 Thoát Quản Trị";
          document.getElementById('btnCreatePost').style.display = "inline-block";
          alert("Chào mừng chủ nhân khu vườn! Cậu đã có thể đăng bài và xóa bài rồi nha ✨");
          renderCards();
        } else if (pass !== null) {
          alert("Sai mật khẩu rồi nè!");
        }
      } else {
        isAdmin = false;
        document.getElementById('adminToggleBtn').innerText = "🔑 Quản trị";
        document.getElementById('btnCreatePost').style.display = "none";
        renderCards();
      }
    }

    function openCreateModal() { document.getElementById('createPostModal').classList.add('active'); }
    function closeCreateModal() { document.getElementById('createPostModal').classList.remove('active'); }

    // Xử lý đăng bài mới
    function handleCreatePost(e) {
      e.preventDefault();
      const newPost = {
        id: Date.now(),
        type: document.getElementById('postType').value,
        title: document.getElementById('postTitle').value.trim(),
        link: document.getElementById('postLink').value.trim(),
        desc: document.getElementById('postDesc').value.trim()
      };

      myData.unshift(newPost);
      savePosts(myData);

      // Đóng modal & reset form
      closeCreateModal();
      e.target.reset();
      renderCards();
      alert("Đăng bài thành công rồi nha! ✨");
    }

    // Xử lý xóa bài
    function deletePost(id) {
      if (confirm("Cậu có chắc muốn xóa bài này không?")) {
        myData = myData.filter(p => p.id !== id);
        savePosts(myData);
        renderCards();
      }
    }

    // Hiển thị cards
    function renderCards() {
      const grid = document.getElementById('cardGrid');
      grid.innerHTML = '';

      const filtered = myData.filter(item => currentFilter === 'all' || item.type === currentFilter);
      const commentsData = getStoredComments();

      filtered.forEach(item => {
        const commentCount = (commentsData[item.id] || []).length;
        const tagText = item.type === 'story' ? '📖 Truyện' : '🤖 Bot AI';
        const tagClass = item.type === 'story' ? 'tag-story' : 'tag-bot';
        const buttonText = item.type === 'story' ? 'Đọc truyện ↗' : 'Trò chuyện ↗';
        const deleteBtnDisplay = isAdmin ? 'inline-block' : 'none';

        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <div>
            <div class="card-top">
              <span class="card-tag ${tagClass}">${tagText}</span>
              <button class="btn-delete" style="display: ${deleteBtnDisplay}" onclick="deletePost(${item.id})">🗑️</button>
            </div>
            <h2 class="card-title">${item.title}</h2>
            <p class="card-desc">${item.desc}</p>
          </div>
          <div class="card-actions">
            <a href="${item.link}" target="_blank" class="btn-link">${buttonText}</a>
            <button class="btn-comment" onclick="openComments(${item.id})">💬 ${commentCount}</button>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function filterItems(type) {
      currentFilter = type;
      document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');
      renderCards();
    }

    // Bình luận
    function getStoredComments() {
      const saved = localStorage.getItem('starry_hub_comments');
      return saved ? JSON.parse(saved) : {};
    }

    function saveComments(comments) {
      localStorage.setItem('starry_hub_comments', JSON.stringify(comments));
    }

    function openComments(id) {
      currentPostId = id;
      const post = myData.find(p => p.id === id);
      document.getElementById('modalPostTitle').innerText = `Góc trò chuyện: ${post ? post.title : ''}`;
      loadCommentsUI();
      document.getElementById('commentModal').classList.add('active');
    }

    function closeComments() {
      document.getElementById('commentModal').classList.remove('active');
      currentPostId = null;
    }

    function loadCommentsUI() {
      const listEl = document.getElementById('modalCommentsList');
      listEl.innerHTML = '';
      const comments = getStoredComments()[currentPostId] || [];

      if (comments.length === 0) {
        listEl.innerHTML = '<p style="color: var(--text-muted); text-align: center; margin-top: 15px;">Chưa có bình luận nào. Hãy thả ngôi sao đầu tiên nhé! ✨</p>';
        return;
      }

      comments.forEach(c => {
        const item = document.createElement('div');
        item.className = 'comment-item';
        item.innerHTML = `
          <div class="comment-author">⭐ ${c.author}</div>
          <div class="comment-text">${c.text}</div>
        `;
        listEl.appendChild(item);
      });
    }

    function handleSendComment(e) {
      e.preventDefault();
      const author = document.getElementById('commentAuthor').value.trim();
      const text = document.getElementById('commentBody').value.trim();
      if (!author || !text) return;

      const allComments = getStoredComments();
      if (!allComments[currentPostId]) allComments[currentPostId] = [];

      allComments[currentPostId].push({ author, text });
      saveComments(allComments);

      document.getElementById('commentAuthor').value = '';
      document.getElementById('commentBody').value = '';
      loadCommentsUI();
      renderCards();
    }

    // Hiệu ứng trời sao
    const canvas = document.getElementById('starCanvas');
    const ctx = canvas.getContext('2d');
    let stars = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      stars = [];
      const count = Math.floor((canvas.width * canvas.height) / 3500);
      const starColors = ['#ffffff', '#ffe082', '#ff80ab', '#80d8ff', '#a7ffeb'];
      for (let i = 0; i < count; i++) {
        stars.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          radius: Math.random() * 1.5 + 0.4,
          color: starColors[Math.floor(Math.random() * starColors.length)],
          alpha: Math.random(),
          speed: Math.random() * 0.02 + 0.005
        });
      }
    }

    function drawStars() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      stars.forEach(s => {
        s.alpha += s.speed;
        if (s.alpha > 1 || s.alpha < 0.1) s.speed = -s.speed;
        ctx.save();
        ctx.globalAlpha = Math.max(0, Math.min(1, s.alpha));
        ctx.fillStyle = s.color;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      });
      requestAnimationFrame(drawStars);
    }

    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();
    drawStars();
    renderCards();
  </script>
</body>
</html>
